name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - name: Pack
        run: dotnet pack src/IPData/IPData.csproj --configuration Release --no-build

  release:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      created: ${{ steps.release.outputs.created }}

    steps:
      - uses: actions/checkout@v4

      - name: Tag and create the release when the version is new
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(sed -nE 's/.*<VersionPrefix>([^<]+)<.*/\1/p' src/IPData/IPData.csproj | head -1)
          if [ -z "$VERSION" ]; then
            echo "::error::VersionPrefix not found in src/IPData/IPData.csproj"
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

          status=0
          git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null || status=$?
          case "$status" in
            0)
              echo "Tag $TAG already exists; nothing to release."
              echo "created=false" >> "$GITHUB_OUTPUT"
              ;;
            2)
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
              echo "Created tag and release $TAG."
              echo "created=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "::error::Could not check whether tag $TAG exists (git ls-remote exit status $status)."
              exit "$status"
              ;;
          esac

  publish:
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
    secrets: inherit
